[project]
name = "meridian-erp-mvp"
version = "0.6.0"
description = "Local-first manufacturing ERP workflow demonstration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meridian"]

[tool.setuptools.package-data]
meridian = ["index.html", "enterprise.js", "enterprise.css", "enterprise-foundations.js", "enterprise-foundations.css", "security.js", "enterprise-flow.js"]
